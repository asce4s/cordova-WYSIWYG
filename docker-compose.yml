version: '3'
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: laravel-server
    container_name: laravel-server
    restart: unless-stopped
    tty: true
    environment:
      - SERVICE_NAME=server
      - SERVICE_TAGS=dev
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=password
    working_dir: /var/www
    volumes:
      - ./server:/var/www
      - /var/www/vendor
    networks:
      - app-network
    ports:
      - "8000:80"
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: mysql-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql/
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: angular-client
    container_name: angular-client
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - app-network
    depends_on:
      - server

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
